<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат дома</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --chat-bg: #f5f5f5;
            --msg-bg: #e0f7fa;
            --btn-bg: #007bff;
            --btn-text: #ffffff;
            --input-border: #ccc;
        }

        [data-theme="dark"] {
            --bg-color: #181818;
            --text-color: #f0f0f0;
            --chat-bg: #242424;
            --msg-bg: #203a43;
            --btn-bg: #1e7e34;
            --btn-text: #ffffff;
            --input-border: #444;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .theme-toggle {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        h2 { margin: 0; font-size: 1.3rem; }

        .chat-box {
            width: 100%;
            max-width: 500px;
            height: 350px;
            background-color: var(--chat-bg);
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--input-border);
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            align-self: flex-start;
            background-color: var(--msg-bg);
        }

        .author {
            font-size: 0.75rem;
            font-weight: bold;
            opacity: 0.7;
            margin-bottom: 3px;
        }

        .controls {
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
        }

        .send-btn {
            width: 100%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h2 id="roomTitle">Комната: Кухня</h2>
        <button class="theme-toggle" id="themeBtn">🌙 Сменить тему</button>
    </header>

    <!-- Окно сообщений -->
    <div class="chat-box" id="chatBox">
        <div class="message">
            <div class="author">Система</div>
            Добро пожаловать в домашний чат!
        </div>
    </div>

    <!-- Поля ввода -->
    <div class="controls">
        <input type="text" id="nameInput" class="input-field" placeholder="Ваше имя (например, Мама)...">
        <input type="text" id="msgInput" class="input-field" placeholder="Введите текст сообщения...">
        <button id="sendBtn" class="send-btn">Отправить</button>
    </div>

    <script>
        // Переключение темы
        const themeBtn = document.getElementById('themeBtn');
        const html = document.documentElement;
        themeBtn.addEventListener('click', () => {
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                themeBtn.textContent = '🌙 Сменить тему';
            } else {
                html.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '☀️ Сменить тему';
            }
        });

        // Логика отправки сообщений
        const chatBox = document.getElementById('chatBox');
        const nameInput = document.getElementById('nameInput');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        function sendMessage() {
            const name = nameInput.value.trim();
            const text = msgInput.value.trim();

            // Проверяем, что поля не пустые
            if (!name || !text) {
                alert('Пожалуйста, введите имя и текст сообщения!');
                return;
            }

            // Создаем новый блок сообщения
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';

            // Создаем блок автора
            const authorDiv = document.createElement('div');
            authorDiv.className = 'author';
            authorDiv.textContent = name;

            // Создаем текст реплики
            const textNode = document.createTextNode(text);

            // Собираем сообщение вместе
            msgDiv.appendChild(authorDiv);
            msgDiv.appendChild(textNode);

            // Добавляем в окно чата
            chatBox.appendChild(msgDiv);

            // Очищаем поле ввода текста (имя оставляем)
            msgInput.value = '';

            // Скроллим чат вниз к новому сообщению
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Отправка по клику на кнопку
        sendBtn.addEventListener('click', sendMessage);

        // Отправка по нажатию Enter в поле ввода
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>

</body>
</html>
