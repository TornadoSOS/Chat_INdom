<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДЗ 7Б | Хайыракан</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1a1a1a;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 3px solid #667eea;
        }
        .header h1 {
            font-size: 28px;
            color: #4a3f8a;
            margin-bottom: 4px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .date-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 12px;
        }
        .section {
            margin-bottom: 28px;
        }
        .section h2 {
            font-size: 18px;
            color: #4a3f8a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .day-card {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        .day-card .day-name {
            font-weight: bold;
            color: #4a3f8a;
            font-size: 15px;
            margin-bottom: 6px;
        }
        .day-card .lesson {
            font-size: 13px;
            color: #444;
            padding: 3px 0;
        }
        .day-card .test {
            color: #dc2626;
            font-weight: bold;
            font-size: 12px;
            margin-left: 6px;
        }
        .subject-card {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 4px solid #16a34a;
        }
        .subject-card h3 {
            font-size: 15px;
            color: #16a34a;
            margin-bottom: 4px;
        }
        .subject-card p {
            font-size: 13px;
            color: #444;
            margin-bottom: 2px;
        }
        .subject-card .topic {
            font-size: 12px;
            color: #888;
            font-style: italic;
        }
        .editor {
            background: #fffbea;
            border: 2px dashed #fbbf24;
            border-radius: 14px;
            padding: 20px;
            margin-top: 24px;
        }
        .editor h2 {
            font-size: 16px;
            color: #b45309;
            margin-bottom: 14px;
        }
        .editor input, .editor textarea, .editor select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .editor textarea { resize: vertical; min-height: 50px; }
        .editor .row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .editor .row > * { flex: 1; }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 8px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
        }
        .btn-green {
            background: linear-gradient(135deg, #16a34a, #15803d);
        }
        .btn-green:hover {
            box-shadow: 0 6px 20px rgba(22,163,74,0.4);
        }
        .btn-red {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }
        .btn-red:hover {
            box-shadow: 0 6px 20px rgba(220,38,38,0.4);
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .item-row:last-child { border-bottom: none; }
        .item-row button {
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .hidden { display: none; }
        .link-box {
            margin-top: 14px;
            padding: 14px;
            background: #e8f0fe;
            border-radius: 10px;
            word-break: break-all;
            font-size: 12px;
        }
        .link-box a {
            color: #1a56db;
            font-weight: bold;
        }
        .empty {
            text-align: center;
            color: #999;
            font-size: 13px;
            padding: 20px;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        .footer a { color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 ДЗ 7Б</h1>
            <p>МБОУ СОШ с. Хайыракан</p>
            <div class="date-badge" id="dateBadge">Дата: сегодня</div>
        </div>

        <!-- РАСПИСАНИЕ -->
        <div class="section">
            <h2>📅 Расписание и контрольные</h2>
            <div id="scheduleList"></div>
        </div>

        <!-- ДЗ -->
        <div class="section">
            <h2>📝 Домашнее задание</h2>
            <div id="tasksList"></div>
        </div>

        <!-- РЕДАКТОР -->
        <div class="editor" id="editor">
            <h2>✏️ Редактор (только для тебя)</h2>

            <h3 style="font-size:14px; color:#b45309; margin-bottom:8px;">Добавить день</h3>
            <input type="text" id="dayInput" placeholder="День недели (например: Понедельник)">
            <input type="text" id="dateInput" placeholder="Число (например: 15.09.2025)">
            <textarea id="lessonsInput" placeholder="Уроки через запятую (Алгебра, Русский, Физика)"></textarea>
            <input type="text" id="testInput" placeholder="Контрольная по какому предмету? (необязательно)">
            <button class="btn btn-green" onclick="addDay()">➕ Добавить день</button>

            <h3 style="font-size:14px; color:#b45309; margin:16px 0 8px;">Добавить ДЗ</h3>
            <div class="row">
                <input type="text" id="subjectInput" placeholder="Предмет">
                <input type="text" id="topicInput" placeholder="Тема урока">
            </div>
            <textarea id="taskInput" placeholder="Задание"></textarea>
            <button class="btn btn-green" onclick="addTask()">➕ Добавить ДЗ</button>

            <button class="btn" onclick="generateLink()" style="margin-top:16px;">📤 Сгенерировать ссылку для класса</button>
            <div id="linkBox" class="link-box hidden"></div>

            <button class="btn btn-red" onclick="clearAll()" style="margin-top:8px;">🗑 Очистить всё</button>
        </div>

        <div class="footer">
            <p>Обновляется вручную | <a href="#">Дневник.ру</a></p>
        </div>
    </div>

    <script>
        // Дата
        const dateBadge = document.getElementById('dateBadge');
        const today = new Date();
        const options = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
        dateBadge.textContent = '📅 ' + today.toLocaleDateString('ru-RU', options);

        // Данные
        let schedule = [
            { day: 'Понедельник', date: '15.09.2025', lessons: 'Алгебра, Русский, Физика, История', test: '' },
            { day: 'Вторник', date: '16.09.2025', lessons: 'Геометрия, Английский, Биология, Физра', test: 'Контрольная по геометрии' },
        ];

        let tasks = [
            { subject: 'Алгебра', topic: 'Квадратные уравнения', task: '№ 123, 124, 125' },
            { subject: 'Русский язык', topic: 'Причастие', task: 'Упражнение 45, выучить правило' },
            { subject: 'Физика', topic: 'Сила трения', task: '§ 12, ответить на вопросы' },
        ];

        // Загрузка из ссылки
        function loadFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            if (data) {
                try {
                    const parsed = JSON.parse(decodeURIComponent(data));
                    if (parsed.schedule) schedule = parsed.schedule;
                    if (parsed.tasks) tasks = parsed.tasks;
                } catch(e) { console.log('Ошибка загрузки'); }
            }
        }

        function render() {
            // Расписание
            const schContainer = document.getElementById('scheduleList');
            schContainer.innerHTML = '';
            if (schedule.length === 0) {
                schContainer.innerHTML = '<div class="empty">Нет расписания</div>';
            } else {
                schedule.forEach((s, i) => {
                    const div = document.createElement('div');
                    div.className = 'day-card';
                    div.innerHTML = `
                        <div class="day-name">${s.day} ${s.date ? '— ' + s.date : ''}</div>
                        <div class="lesson">${s.lessons}</div>
                        ${s.test ? '<div class="lesson">⚠️ <span class="test">' + s.test + '</span></div>' : ''}
                        <div class="item-row" style="border:none; padding-top:6px;">
                            <button onclick="deleteDay(${i})">Удалить</button>
                        </div>
                    `;
                    schContainer.appendChild(div);
                });
            }

            // ДЗ
            const taskContainer = document.getElementById('tasksList');
            taskContainer.innerHTML = '';
            if (tasks.length === 0) {
                taskContainer.innerHTML = '<div class="empty">Нет домашнего задания</div>';
            } else {
                tasks.forEach((t, i) => {
                    const div = document.createElement('div');
                    div.className = 'subject-card';
                    div.innerHTML = `
                        <h3>${t.subject}</h3>
                        ${t.topic ? '<div class="topic">Тема: ' + t.topic + '</div>' : ''}
                        <p>${t.task}</p>
                        <div class="item-row" style="border:none; padding-top:6px;">
                            <button onclick="deleteTask(${i})">Удалить</button>
                        </div>
                    `;
                    taskContainer.appendChild(div);
                });
            }
        }

        function addDay() {
            const day = document.getElementById('dayInput').value.trim();
            const date = document.getElementById('dateInput').value.trim();
            const lessons = document.getElementById('lessonsInput').value.trim();
            const test = document.getElementById('testInput').value.trim();
            if (!day || !lessons) return;
            schedule.push({ day, date, lessons, test });
            document.getElementById('dayInput').value = '';
            document.getElementById('dateInput').value = '';
            document.getElementById('lessonsInput').value = '';
            document.getElementById('testInput').value = '';
            render();
        }

        function addTask() {
            const subject = document.getElementById('subjectInput').value.trim();
            const topic = document.getElementById('topicInput').value.trim();
            const task = document.getElementById('taskInput').value.trim();
            if (!subject || !task) return;
            tasks.push({ subject, topic, task });
            document.getElementById('subjectInput').value = '';
            document.getElementById('topicInput').value = '';
            document.getElementById('taskInput').value = '';
            render();
        }

        function deleteDay(i) {
            schedule.splice(i, 1);
            render();
        }

        function deleteTask(i) {
            tasks.splice(i, 1);
            render();
        }

        function generateLink() {
            const data = { schedule, tasks };
            const encoded = encodeURIComponent(JSON.stringify(data));
            const url = window.location.origin + window.location.pathname + '?data=' + encoded;
            
            const linkBox = document.getElementById('linkBox');
            linkBox.classList.remove('hidden');
            linkBox.innerHTML = `
                <b>Ссылка для класса:</b><br>
                <a href="${url}" target="_blank">${url}</a><br><br>
                <button class="btn" onclick="navigator.clipboard.writeText('${url}')">📋 Скопировать</button>
            `;
        }

        function clearAll() {
            if (confirm('Точно очистить всё?')) {
                schedule = [];
                tasks = [];
                render();
            }
        }

        loadFromUrl();
        render();
    </script>
</body>
</html>
