<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейные Комнаты</title>
    <!-- Бесплатное облако сообщений -->
    <script src="https://pubnub.com"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --box-bg: white;
            --text-color: #333333;
            --border-color: #cccccc;
            --input-bg: white;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --box-bg: #242526;
            --text-color: #e4e6eb;
            --border-color: #3e4042;
            --input-bg: #3a3b3c;
        }

        body { font-family: Arial, sans-serif; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; transition: background 0.3s; }
        .chat-container { background: var(--box-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; transition: background 0.3s; }
        h2 { text-align: center; color: var(--text-color); margin-top: 0; }
        #welcome-user { text-align: center; color: var(--text-color); font-size: 14px; margin-bottom: 10px; }
        #messages { border: 1px solid var(--border-color); height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: var(--input-bg); color: var(--text-color); border-radius: 5px; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 5px; border: 1px solid var(--border-color); box-sizing: border-box; font-size: 16px; background: var(--input-bg); color: var(--text-color); }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .msg-box { margin-bottom: 8px; word-wrap: break-word; color: var(--text-color); }
        
        .theme-btn {
            background: #6c757d;
            color: white;
            padding: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            width: auto;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <button class="theme-btn" onclick="toggleTheme()">🌙 Сменить тему (День/Ночь)</button>

    <div class="chat-container">
        <h2 id="room-title">Вход в Чат</h2>
        <div id="welcome-user"></div>
        
        <!-- Форма входа (теперь только выбор комнаты) -->
        <div id="login-form">
            <input type="text" id="room" placeholder="Название комнаты (например, Кухня)">
            <button onclick="initChat()">Войти в комнату</button>
        </div>
        
        <!-- Окно самого чата -->
        <div id="chat-box" style="display:none;">
            <div id="messages"></div>
            <input type="text" id="message-text" placeholder="Напишите сообщение...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        let pubnub;
        let currentRoom = "";
        let myName = "";

        // Сайт сразу спрашивает имя при загрузке страницы
        window.onload = function() {
            while (!myName) {
                myName = prompt("Как тебя зовут? (Мама / Папа / Твое имя)");
                if (myName) myName = myName.trim();
            }
            document.getElementById('welcome-user').innerText = "Привет, " + myName + "! Куда зайдем?";
        };

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }

        function initChat() {
            currentRoom = document.getElementById('room').value.trim().toLowerCase();
            
            if (!currentRoom) {
                alert("Введите название комнаты!");
                return;
            }

            document.getElementById('login-form').style.display = 'none';
            document.getElementById('welcome-user').style.display = 'none';
            document.getElementById('chat-box').style.display = 'block';
            document.getElementById('room-title').innerText = "Комната: " + currentRoom;

            pubnub = new PubNub({
                publishKey: 'pub-c-4613b53c-c692-4d0f-8c3b-554471018861',
                subscribeKey: 'sub-c-4e5cb42e-1311-4776-9c42-5bf06fc005f0',
                userId: myName
            });

            pubnub.addListener({
                message: function(event) {
                    const msgHtml = `<div class="msg-box"><b>${event.message.sender}:</b> ${event.message.text}</div>`;
                    const msgDiv = document.getElementById('messages');
                    msgDiv.innerHTML += msgHtml;
                    msgDiv.scrollTop = msgDiv.scrollHeight;
                }
            });

            pubnub.subscribe({ channels: [currentRoom] });
        }

        function sendMessage() {
            const input = document.getElementById('message-text');
            const text = input.value.trim();
            
            if (text && pubnub) {
                pubnub.publish({
                    channel: currentRoom,
                    message: { sender: myName, text: text }
                });
                input.value = '';
            }
        }
    </script>
</body>
</html>
