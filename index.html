<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДЗ 7Б | Хайыракан</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #1a1a1a;
        }
        .container {
            max-width: 800px; margin: 0 auto; background: #fff;
            border-radius: 20px; padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 3px solid #667eea; }
        .header h1 { font-size: 28px; color: #4a3f8a; margin-bottom: 4px; }
        .header p { color: #666; font-size: 14px; }
        .date-badge {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; padding: 8px 20px; border-radius: 20px;
            font-size: 14px; font-weight: bold; margin-top: 12px;
        }
        .section { margin-bottom: 28px; }
        .section h2 { font-size: 18px; color: #4a3f8a; margin-bottom: 14px; }
        .day-card, .subject-card {
            background: #f8f9ff; border-radius: 12px; padding: 14px 18px;
            margin-bottom: 10px; border-left: 4px solid #667eea;
        }
        .subject-card { border-left-color: #16a34a; }
        .day-card .day-name { font-weight: bold; color: #4a3f8a; font-size: 15px; margin-bottom: 6px; }
        .day-card .lesson { font-size: 13px; color: #444; padding: 3px 0; }
        .day-card .test { color: #dc2626; font-weight: bold; font-size: 12px; }
        .subject-card h3 { font-size: 15px; color: #16a34a; margin-bottom: 4px; }
        .subject-card p { font-size: 13px; color: #444; margin-bottom: 2px; }
        .subject-card .topic { font-size: 12px; color: #888; font-style: italic; }
        .editor {
            background: #fffbea; border: 2px dashed #fbbf24;
            border-radius: 14px; padding: 20px; margin-top: 24px;
        }
        .editor h2 { font-size: 16px; color: #b45309; margin-bottom: 14px; }
        .editor input, .editor textarea {
            width: 100%; padding: 10px 12px; margin-bottom: 8px;
            border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
        }
        .editor textarea { resize: vertical; min-height: 50px; }
        .row { display: flex; gap: 8px; margin-bottom: 8px; }
        .row > * { flex: 1; }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; border-radius: 10px;
            padding: 12px 24px; font-size: 14px; font-weight: bold;
            cursor: pointer; width: 100%; margin-top: 8px;
        }
        .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); }
        .btn-red { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .item-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
        .item-row button { background: #dc2626; color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
        .footer { margin-top: 24px; text-align: center; font-size: 12px; color: #999; }
        .loading { text-align: center; padding: 40px; color: #667eea; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 ДЗ 7Б</h1>
            <p>МБОУ СОШ с. Хайыракан</p>
            <div class="date-badge" id="dateBadge">Дата: сегодня</div>
        </div>

        <div class="section">
            <h2>📅 Расписание и контрольные</h2>
            <div id="scheduleList"><div class="loading">Загрузка...</div></div>
        </div>

        <div class="section">
            <h2>📝 Домашнее задание</h2>
            <div id="tasksList"><div class="loading">Загрузка...</div></div>
        </div>

        <div class="editor" id="editor">
            <h2>✏️ Редактор</h2>

            <h3 style="font-size:14px; color:#b45309; margin-bottom:8px;">Добавить день</h3>
            <input type="text" id="dayInput" placeholder="День недели (например: Понедельник)">
            <input type="text" id="dateInput" placeholder="Число (например: 15.09.2025)">
            <textarea id="lessonsInput" placeholder="Уроки через запятую (Алгебра, Русский, Физика)"></textarea>
            <input type="text" id="testInput" placeholder="Контрольная по какому предмету? (необязательно)">
            <button class="btn btn-green" onclick="addDay()">➕ Добавить день</button>

            <h3 style="font-size:14px; color:#b45309; margin:16px 0 8px;">Добавить ДЗ</h3>
            <div class="row">
                <input type="text" id="subjectInput" placeholder="Предмет">
                <input type="text" id="topicInput" placeholder="Тема урока">
            </div>
            <textarea id="taskInput" placeholder="Задание"></textarea>
            <button class="btn btn-green" onclick="addTask()">➕ Добавить ДЗ</button>

            <button class="btn btn-red" onclick="clearAll()" style="margin-top:16px;">🗑 Очистить всё</button>
        </div>

        <div class="footer">
            <p>Данные сохраняются в Supabase | <a href="#">Дневник.ру</a></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yodcqlciujotdhglgrpb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_82w2MvTLIlfCLYijvdNqfg_DtQNHCs9';

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const dateBadge = document.getElementById('dateBadge');
        const today = new Date();
        const options = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
        dateBadge.textContent = '📅 ' + today.toLocaleDateString('ru-RU', options);

        async function loadData() {
            const { data: sch } = await db.from('schedule').select('*');
            const schContainer = document.getElementById('scheduleList');
            schContainer.innerHTML = '';
            if (!sch || sch.length === 0) {
                schContainer.innerHTML = '<div class="loading">Нет расписания</div>';
            } else {
                sch.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'day-card';
                    div.innerHTML = `
                        <div class="day-name">${s.day} ${s.date ? '— ' + s.date : ''}</div>
                        <div class="lesson">${s.lessons}</div>
                        ${s.test ? '<div class="lesson">⚠️ <span class="test">' + s.test + '</span></div>' : ''}
                        <div class="item-row" style="border:none; padding-top:6px;">
                            <button onclick="deleteDay(${s.id})">Удалить</button>
                        </div>
                    `;
                    schContainer.appendChild(div);
                });
            }

            const { data: tsk } = await db.from('tasks').select('*');
            const taskContainer = document.getElementById('tasksList');
            taskContainer.innerHTML = '';
            if (!tsk || tsk.length === 0) {
                taskContainer.innerHTML = '<div class="loading">Нет домашнего задания</div>';
            } else {
                tsk.forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'subject-card';
                    div.innerHTML = `
                        <h3>${t.subject}</h3>
                        ${t.topic ? '<div class="topic">Тема: ' + t.topic + '</div>' : ''}
                        <p>${t.task}</p>
                        <div class="item-row" style="border:none; padding-top:6px;">
                            <button onclick="deleteTask(${t.id})">Удалить</button>
                        </div>
                    `;
                    taskContainer.appendChild(div);
                });
            }
        }

        async function addDay() {
            const day = document.getElementById('dayInput').value.trim();
            const date = document.getElementById('dateInput').value.trim();
            const lessons = document.getElementById('lessonsInput').value.trim();
            const test = document.getElementById('testInput').value.trim();
            if (!day || !lessons) return;
            await db.from('schedule').insert([{ day, date, lessons, test }]);
            document.getElementById('dayInput').value = '';
            document.getElementById('dateInput').value = '';
            document.getElementById('lessonsInput').value = '';
            document.getElementById('testInput').value = '';
            loadData();
        }

        async function addTask() {
            const subject = document.getElementById('subjectInput').value.trim();
            const topic = document.getElementById('topicInput').value.trim();
            const task = document.getElementById('taskInput').value.trim();
            if (!subject || !task) return;
            await db.from('tasks').insert([{ subject, topic, task }]);
            document.getElementById('subjectInput').value = '';
            document.getElementById('topicInput').value = '';
            document.getElementById('taskInput').value = '';
            loadData();
        }

        async function deleteDay(id) {
            await db.from('schedule').delete().eq('id', id);
            loadData();
        }

        async function deleteTask(id) {
            await db.from('tasks').delete().eq('id', id);
            loadData();
        }

        async function clearAll() {
            if (!confirm('Точно очистить всё?')) return;
            await db.from('schedule').delete().neq('id', 0);
            await db.from('tasks').delete().neq('id', 0);
            loadData();
        }

        window.deleteDay = deleteDay;
        window.deleteTask = deleteTask;
        window.clearAll = clearAll;
        window.addDay = addDay;
        window.addTask = addTask;

        loadData();
    </script>
</body>
</html>
