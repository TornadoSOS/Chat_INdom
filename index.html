<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание | 7 "Б" Класс</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="container animate-drop">
            <span class="school-badge">ХАЙЫРАКАН</span>
            <h1>7 "Б" Класс</h1>
            <p class="subtitle">Интерактивное расписание уроков</p>
            
            <!-- Кнопки переключения дней (управляются через JS) -->
            <div class="day-selector">
                <button class="day-btn active" onclick="loadDay('monday')">Пон</button>
                <button class="day-btn" onclick="loadDay('tuesday')">Втор</button>
                <button class="day-btn" onclick="loadDay('wednesday')">Среда</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Сюда JavaScript будет динамически вставлять карточки с анимацией -->
        <div id="schedule-container" class="schedule-wrapper"></div>
    </main>

    <footer class="main-footer animate-fade">
        <div class="container">
            <p>Движок сайта: <span class="tech-stack">Node.js + Express</span></p>
            <p class="speed-tag">Пинг интерфейса: <span id="ping-counter">0.1 ms</span></p>
        </div>
    </footer>

    <!-- Подключаем JavaScript-логику -->
    <script src="script.js"></script>
</body>
</html>
